<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiet Preview for Netflix</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon48.png" alt="">
        <div>
          <h1>Quiet Preview for Netflix</h1>
        </div>
      </header>

      <label class="enabled-row">
        <span>拡張機能を有効にする</span>
        <input id="enabled" type="checkbox" role="switch">
      </label>

      <div id="controls">
        <fieldset>
          <legend>ミュート</legend>
          <label class="choice">
            <input type="radio" name="mode" value="initialMute">
            <span class="choice-copy">
              <span>開始時はミュート</span>
              <small>あとから音を出せます</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="mute">
            <span>常にミュート</span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="off">
            <span>ミュートOFF</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>音量</legend>
          <label class="volume-toggle">
            <span>音量を指定</span>
            <input id="volumeEnabled" type="checkbox" role="switch">
          </label>

          <div class="slider-row">
            <input id="volume" type="range" min="0" max="100" step="1" aria-label="プレビューの音量">
            <output id="volumeValue" for="volume">20%</output>
          </div>
        </fieldset>
      </div>

      <label class="indicator-row">
        <span class="indicator-label">
          <span class="indicator-icon" aria-hidden="true">🔊</span>
          <span>プレビュー上にミュート・音量を表示</span>
        </span>
        <input id="showIndicator" type="checkbox" role="switch">
      </label>

      <p class="note">作品本編の音量には影響しません。</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
